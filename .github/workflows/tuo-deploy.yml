name: TUO-Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: credzba_legacy)'
        required: true
        default: 'credzba_legacy'

env:
  CUO_OUTPUT_PATH: 'bin/dist'
  CUO_PROJECT_PATH: "src/ClassicUO.Client/ClassicUO.Client.csproj"
  # Bootstrap project not present in this repo
  R2_BUCKET: tazuo-releases
  R2_PREFIX: legacy

  DOTNET_NOLOGO: false
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || github.ref }}

    - name: Get submodules
      run: |
        git config --global url."https://".insteadOf git://
        git submodule update --init --recursive
        
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Build
      run: dotnet publish ${{ env.CUO_PROJECT_PATH }} -c Release -o ${{ env.CUO_OUTPUT_PATH }} -r ${{ matrix.rid }} -p:CustomAssemblyName=TazUO-${{ matrix.rid }}

    - name: Zip build
      shell: bash
      run: |
        cd ${{ env.CUO_OUTPUT_PATH }}
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          pwsh -Command "Compress-Archive -Path * -DestinationPath ../${{ matrix.rid }}.zip -Force"
        else
          zip -r ../${{ matrix.rid }}.zip .
        fi

    - name: Upload to R2
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      run: |
        set -euo pipefail
        if ! command -v aws >/dev/null 2>&1; then
          python3 -m pip install --quiet awscli 2>/dev/null || pip install --quiet awscli
        fi
        aws s3 cp "bin/${{ matrix.rid }}.zip" \
          "s3://${R2_BUCKET}/${R2_PREFIX}/tazuo-${R2_PREFIX}-${{ matrix.rid }}.zip" \
          --endpoint-url "${R2_ENDPOINT}" \
          --region auto \
          --content-type application/zip \
          --cache-control "max-age=60"
        # Remove objects from the old naming scheme (keeps one build per folder).
        for old in win-x64.zip linux-x64.zip; do
          aws s3 rm "s3://${R2_BUCKET}/${R2_PREFIX}/${old}" \
            --endpoint-url "${R2_ENDPOINT}" --region auto || true
        done
        echo "Uploaded s3://${R2_BUCKET}/${R2_PREFIX}/tazuo-${R2_PREFIX}-${{ matrix.rid }}.zip"

  notify:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH="${{ inputs.branch || github.ref_name }}"
          echo "DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

          # Get the last successful run's head commit (excluding this run)
          LAST_SHA=$(gh api "/repos/${{ github.repository }}/actions/workflows/tuo-deploy.yml/runs?status=success&per_page=1&branch=${BRANCH}" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")

          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" = "null" ]; then
            LOG=$(git log --oneline -20 --format='• %h %s' 2>/dev/null || echo "(no commits)")
          else
            LOG=$(git log --oneline "${LAST_SHA}..HEAD" --format='• %h %s' 2>/dev/null || echo "(no new commits)")
          fi

          # Discord caps message content at 2000 characters; keep the commit list well under it.
          LOG=$(NOTES="$LOG" python3 - <<'PYEOF'
          import os
          log = os.environ["NOTES"]
          limit = 1600
          if len(log) > limit:
              log = log[:limit].rsplit("\n", 1)[0] + "\n• ...truncated"
          print(log)
          PYEOF
          )

          echo "LOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Discord notification
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_NET472 }}
          content: |
            **TazUO Legacy build complete**
            🕐 ${{ steps.notes.outputs.DATE }}
            📦 Windows: ${{ secrets.R2_PUBLIC_BASE }}/legacy/tazuo-legacy-win-x64.zip
            📦 Linux:   ${{ secrets.R2_PUBLIC_BASE }}/legacy/tazuo-legacy-linux-x64.zip

            **Commits since last build:**
            ${{ steps.notes.outputs.LOG }}
